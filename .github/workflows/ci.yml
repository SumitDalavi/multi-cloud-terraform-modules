name: Terraform CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate:
    name: Validate Modules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.0"

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: v0.52.0

    - name: Validate Simple Modules (no external registry deps)
      env:
        TF_CLI_ARGS_init: "-lock=false"
      run: |
        # Validate aws/s3 directly — no external module sources, straightforward provider init
        cd modules/aws/s3
        terraform init -backend=false -input=false -lock=false -upgrade
        terraform validate
        echo "✅ modules/aws/s3 validated"

    - name: TFLint Syntax Check (all modules, no cloud creds needed)
      run: |
        # TFLint does syntax/best-practice checks without needing provider auth
        find modules -name "main.tf" -not -path "*/.terraform/*" | while read tf; do
          dir=$(dirname "$tf")
          echo "=== Linting $dir ==="
          (cd "$dir" && tflint --init && tflint -f compact) || echo "  ⚠️ tflint warnings in $dir (non-fatal)"
        done

    - name: Upload Module Structure Summary
      run: |
        echo "## Terraform Module Structure" >> $GITHUB_STEP_SUMMARY
        find modules -name "main.tf" -not -path "*/.terraform/*" | sort | while read tf; do
          dir=$(dirname "$tf")
          vars=$(grep -c "^variable" "$dir/variables.tf" 2>/dev/null || echo "0")
          echo "- \`$dir\` — $vars variables" >> $GITHUB_STEP_SUMMARY
        done

  terratest:
    name: Terratest Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.0"

    - name: Run Terratest (validate-only, no cloud credentials needed)
      run: |
        cd tests
        # Use go test with -mod=mod to handle module dependencies without go mod tidy
        # TestAwsS3ModuleValidation and TestAzureAksModuleValidation use InitAndValidate
        # which runs terraform init + validate without creating real cloud resources
        go test -v -mod=mod -run "TestAwsS3ModuleValidation" -timeout 10m

